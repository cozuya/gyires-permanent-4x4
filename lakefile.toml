name = "RequestProject"
defaultTargets = ["RequestProject", "GyiresEquality"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "GyiresCompute"
roots = ["GyiresCompute.Basic"]
precompileModules = true

[[lean_lib]]
name = "GyiresStrictCompute"
roots = ["GyiresStrictCompute.Basic"]
precompileModules = true

[[lean_lib]]
name = "GyiresEquality"
globs = ["GyiresEquality.+"]
